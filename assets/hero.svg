<text x="36" y="150" opacity="0"><tspan fill="#00FF88">&gt;</tspan> Access granted.<animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/></text>
<text x="36" y="170" opacity="0" fill="#00FF88">&gt; _<animate attributeName="opacity" values="1;0;1" dur="1s" begin="3s" repeatCount="indefinite"/></text>
</g>

<text x="26" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono','Courier New',monospace" font-size="12" fill="#91A69C">Software Engineering <tspan fill="#00FF88">|</tspan> AI Enthusiast <tspan fill="#00FF88">|</tspan> Tech Explorer</text>

